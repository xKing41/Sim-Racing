<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sim Racing &middot; Autodrom Nordwind</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127950;</text></svg>">
<!--
  Sim Racing 0.1.0 - vollstaendig eigenstaendige Fassung.
  Enthaelt Spiel, Stylesheet und three.js. Braucht keinen Server und keine
  Internetverbindung. Erzeugt mit: npm run build
-->
<style>
/* ---------------------------------------------------------------- Grundlage */
:root {
  --bg: #0b0d12;
  --panel: rgba(14, 17, 23, 0.82);
  --panel-line: rgba(255, 255, 255, 0.1);
  --text: #eef1f5;
  --muted: #97a1ae;
  --accent: #3f8cff;
  --good: #2fd07a;
  --bad: #ff5a4d;
  --best: #b981ff;
  --warn: #ffb020;
  --hud-font: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui-font);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

#ui > * { pointer-events: auto; }

/* ------------------------------------------------------------------- Start */
#boot {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 40%, #16202e, #080a0f 70%);
  z-index: 50;
}
.boot-title { font-size: 26px; letter-spacing: 0.32em; font-weight: 700; text-align: center; }
.boot-bar {
  width: 210px; height: 3px; margin: 18px auto 10px;
  background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden;
}
.boot-bar span {
  display: block; height: 100%; width: 40%;
  background: var(--accent); border-radius: 2px;
  animation: boot 1.1s ease-in-out infinite;
}
@keyframes boot { 0% { transform: translateX(-100%);} 100% { transform: translateX(300%);} }
.boot-note { color: var(--muted); font-size: 13px; text-align: center; }
.boot-error { max-width: 90vw; color: var(--bad); font-family: var(--hud-font); font-size: 12px; }
.boot-error pre { white-space: pre-wrap; color: var(--muted); }

/* --------------------------------------------------------------------- HUD */
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud > * { pointer-events: none; }

.hud-panel {
  position: absolute;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 12px;
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  padding: 10px 12px;
}

/* Rundenzeiten */
.hud-times { top: 12px; left: 12px; min-width: 210px; }
.hud-lap-label {
  font-size: 10px; letter-spacing: 0.18em; color: var(--muted);
  font-weight: 700; margin-bottom: 6px;
}
.hud-lap-label.invalid { color: var(--warn); }
.hud-time-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.hud-key { font-size: 9.5px; letter-spacing: 0.14em; color: var(--muted); }
.hud-val { font-family: var(--hud-font); font-size: 15px; font-variant-numeric: tabular-nums; }
.hud-big { font-size: 22px; font-weight: 600; }
.hud-purple { color: var(--best); }
.hud-delta {
  font-family: var(--hud-font); font-size: 15px; font-weight: 600;
  min-height: 19px; margin-top: 3px; text-align: right;
}
.hud-delta.faster { color: var(--good); }
.hud-delta.slower { color: var(--bad); }

.hud-sectors { display: flex; gap: 4px; margin-top: 8px; }
.hud-sector {
  flex: 1; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.14);
}
.hud-sector.active { background: rgba(255,255,255,0.4); }
.hud-sector.good { background: var(--best); }
.hud-sector.ok { background: var(--good); }

/* Tacho */
.hud-dash { top: 12px; right: 12px; min-width: 228px; }
.hud-revbar { display: flex; gap: 2px; margin-bottom: 9px; }
.hud-rev-seg {
  flex: 1; height: 7px; border-radius: 1.5px;
  background: rgba(255,255,255,0.1);
  transition: background 40ms linear;
}
.hud-rev-seg[data-zone="green"].on { background: #3ad07a; }
.hud-rev-seg[data-zone="yellow"].on { background: #ffc233; }
.hud-rev-seg[data-zone="red"].on { background: #ff4a3d; }
.hud-revbar.shift .hud-rev-seg { background: #ff2f6a; animation: shiftflash 90ms steps(2) infinite; }
@keyframes shiftflash { 50% { opacity: 0.25; } }

.hud-readout { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.hud-speedbox { display: flex; align-items: baseline; gap: 5px; }
.hud-speed {
  font-family: var(--hud-font); font-size: 40px; font-weight: 700;
  line-height: 0.95; font-variant-numeric: tabular-nums;
}
.hud-unit { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; }
.hud-gear {
  font-family: var(--hud-font); font-size: 38px; font-weight: 700;
  line-height: 0.95; min-width: 36px; text-align: center;
  color: var(--accent);
}
.hud-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 7px; font-size: 10px; color: var(--muted);
}
.hud-rpm { font-family: var(--hud-font); letter-spacing: 0.04em; }
.hud-assists { display: flex; gap: 5px; }
.hud-lamp {
  padding: 1px 5px; border-radius: 4px; font-size: 9px; font-weight: 700;
  letter-spacing: 0.08em;
  background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.28);
}
.hud-lamp.on { background: var(--warn); color: #1a1205; }

.hud-inputs { display: flex; align-items: flex-end; gap: 6px; margin-top: 9px; height: 34px; }
.hud-bar-wrap {
  width: 9px; height: 34px; border-radius: 3px;
  background: rgba(255,255,255,0.09);
  display: flex; align-items: flex-end; overflow: hidden;
}
.hud-bar { width: 100%; height: 0%; border-radius: 3px; transition: height 40ms linear; }
.hud-bar-throttle { background: var(--good); }
.hud-bar-brake { background: var(--bad); }
.hud-steer {
  flex: 1; height: 9px; align-self: center; position: relative;
  background: rgba(255,255,255,0.09); border-radius: 5px;
}
.hud-steer::after {
  content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px;
  width: 1px; background: rgba(255,255,255,0.2);
}
.hud-steer-dot {
  position: absolute; top: 50%; width: 11px; height: 11px;
  margin-left: -5.5px; margin-top: -5.5px;
  background: var(--accent); border-radius: 50%;
  transition: left 40ms linear;
}

/* Karte */
.hud-map {
  position: absolute; right: 12px; top: 176px;
  width: 132px; height: 132px;
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: 12px;
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
}

/* Rundenliste */
.hud-laplist {
  position: absolute; left: 12px; top: 176px;
  display: flex; flex-direction: column; gap: 2px;
  font-family: var(--hud-font); font-size: 11px;
}
.hud-lap-entry {
  display: flex; gap: 10px; justify-content: space-between;
  min-width: 128px; padding: 3px 8px; border-radius: 6px;
  background: rgba(14,17,23,0.66); color: var(--muted);
}
.hud-lap-entry.hud-lap-best { color: var(--best); }
.hud-lap-entry.hud-lap-invalid { color: rgba(255,176,32,0.65); text-decoration: line-through; }

/* Meldungen */
.hud-message {
  position: absolute; left: 50%; top: 20%;
  transform: translate(-50%, -8px);
  padding: 9px 18px; border-radius: 10px;
  background: rgba(10,13,18,0.86);
  border: 1px solid var(--panel-line);
  font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
  opacity: 0; transition: opacity 180ms, transform 180ms;
  white-space: nowrap;
}
.hud-message-show { opacity: 1; transform: translate(-50%, 0); }
.hud-message.warn { color: var(--warn); }
.hud-message.best { color: var(--best); }

/* ------------------------------------------------------------------ Touch */
.touch { position: absolute; inset: 0; pointer-events: none; }
.touch > * { pointer-events: auto; }

.touch-btn {
  position: absolute;
  display: grid; place-items: center;
  border-radius: 18px;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.17);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  font-weight: 700; font-size: 13px; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.82);
  touch-action: none;
  transition: background 70ms, transform 70ms;
}
.touch-btn.active { background: rgba(255,255,255,0.26); transform: scale(0.97); }

.touch-steer-zone { position: absolute; inset: 0; pointer-events: none; }
.touch-steer-zone > * { pointer-events: auto; }
.touch-left  { left: 16px;  bottom: 18px; width: 92px; height: 92px; font-size: 22px; }
.touch-right { left: 118px; bottom: 18px; width: 92px; height: 92px; font-size: 22px; }

.touch-slider {
  position: absolute; left: 16px; bottom: 22px;
  width: min(42vw, 330px); height: 74px;
  border-radius: 20px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  touch-action: none;
}
.touch-slider-track {
  position: absolute; left: 12px; right: 12px; top: 50%; height: 3px;
  margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.18);
}
.touch-slider-knob {
  position: absolute; top: 50%; left: 50%;
  width: 52px; height: 52px; margin: -26px 0 0 -26px;
  border-radius: 50%; background: rgba(63,140,255,0.85);
  border: 2px solid rgba(255,255,255,0.35);
}

.touch-pedals { position: absolute; right: 16px; bottom: 18px; display: flex; gap: 10px; }
.touch-brake    { position: relative; width: 86px; height: 118px; background: rgba(255,90,77,0.17); border-color: rgba(255,90,77,0.4); }
.touch-throttle { position: relative; width: 86px; height: 118px; background: rgba(47,208,122,0.17); border-color: rgba(47,208,122,0.4); }

.touch-side {
  position: absolute; right: 16px; bottom: 146px;
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  max-width: 206px;
}
.touch-mini-reset { background: rgba(255,176,32,0.18); border-color: rgba(255,176,32,0.42); }
.touch-mini {
  width: 54px; height: 44px; display: grid; place-items: center;
  border-radius: 12px; font-weight: 700; font-size: 13px;
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.17);
  color: rgba(255,255,255,0.8);
  touch-action: none;
}
.touch-mini.active { background: rgba(255,255,255,0.26); }

/* ------------------------------------------------------------------- Menue */
.menu {
  position: absolute; inset: 0;
  display: none; place-items: center;
  background: radial-gradient(circle at 50% 30%, rgba(22,32,46,0.93), rgba(6,8,12,0.96));
  padding: 16px;
  overflow: auto;
}
.menu.open { display: grid; }

.menu-panel {
  width: min(560px, 100%);
  background: rgba(13,16,22,0.9);
  border: 1px solid var(--panel-line);
  border-radius: 18px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.5);
  overflow: hidden;
  max-height: calc(100vh - 32px);
  display: flex; flex-direction: column;
}
.menu-header { padding: 22px 22px 14px; border-bottom: 1px solid var(--panel-line); }
.menu-title { margin: 0; font-size: 28px; letter-spacing: 0.22em; font-weight: 800; }
.menu-subtitle { color: var(--muted); font-size: 12.5px; margin-top: 5px; letter-spacing: 0.06em; }

.menu-body { padding: 6px 22px 12px; overflow: auto; flex: 1; }
.menu-section { padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.menu-section:last-child { border-bottom: none; }
.menu-section-title {
  font-size: 10px; letter-spacing: 0.2em; color: var(--muted);
  font-weight: 700; margin-bottom: 10px;
}
.menu-section-body { display: flex; flex-direction: column; gap: 9px; }

.menu-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.menu-chip {
  padding: 7px 13px; border-radius: 9px; font-size: 12.5px; font-weight: 600;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--muted); cursor: pointer; font-family: inherit;
}
.menu-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

.menu-toggle {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; cursor: pointer;
}
.menu-toggle-label { font-size: 13.5px; font-weight: 600; }
.menu-toggle-hint { font-size: 11px; color: var(--muted); margin-top: 1px; }
.menu-switch { width: 42px; height: 24px; flex: none; accent-color: var(--accent); cursor: pointer; }

.menu-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.menu-hint { font-size: 11.5px; color: var(--muted); flex: 1; }

.menu-slider-row { display: flex; align-items: center; gap: 10px; }
.menu-slider-label { font-size: 12.5px; color: var(--muted); min-width: 120px; }
.menu-slider { flex: 1; accent-color: var(--accent); }
.menu-slider-value { font-family: var(--hud-font); font-size: 12px; min-width: 34px; text-align: right; }
.menu-number {
  width: 64px; padding: 6px 9px; border-radius: 8px; text-align: center;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  color: var(--text); font-family: var(--hud-font); font-size: 14px;
}

.menu-colors { display: flex; flex-wrap: wrap; gap: 8px; }
.menu-color {
  width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
  border: 2px solid rgba(255,255,255,0.15);
}
.menu-color.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(63,140,255,0.55); }

.menu-keys { display: grid; grid-template-columns: 1fr; gap: 4px; }
.menu-key-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.menu-key-row kbd {
  font-family: var(--hud-font); font-size: 11px;
  background: rgba(255,255,255,0.07); padding: 2px 7px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.1); color: var(--text);
}

.menu-results { display: flex; flex-direction: column; gap: 2px; }
.menu-result-row {
  display: grid; grid-template-columns: 44px 1fr 56px 56px 56px;
  font-family: var(--hud-font); font-size: 12px; padding: 3px 6px;
  border-radius: 5px; color: var(--text);
}
.menu-result-head { color: var(--muted); font-size: 10px; letter-spacing: 0.1em; }
.menu-result-row.best { color: var(--best); background: rgba(185,129,255,0.1); }
.menu-result-row.invalid { color: rgba(255,176,32,0.6); }

.menu-footer {
  display: flex; gap: 10px; padding: 14px 22px 18px;
  border-top: 1px solid var(--panel-line);
}
.menu-btn {
  flex: 1; padding: 13px 16px; border-radius: 11px;
  font-size: 14px; font-weight: 700; letter-spacing: 0.08em;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: var(--text); cursor: pointer; font-family: inherit;
}
.menu-btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
.menu-btn:disabled { opacity: 0.4; cursor: default; }
.menu-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.menu-btn-primary:hover { background: #5a9dff; }
.menu-btn-small { flex: none; padding: 7px 12px; font-size: 11.5px; letter-spacing: 0.04em; }

/* --------------------------------------------------------- kleine Schirme */
@media (max-width: 760px) {
  .hud-times { min-width: 168px; padding: 8px 10px; }
  .hud-big { font-size: 18px; }
  .hud-dash { min-width: 190px; padding: 8px 10px; }
  .hud-speed { font-size: 32px; }
  .hud-gear { font-size: 30px; }
  .hud-map { width: 104px; height: 104px; top: 150px; }
  .hud-laplist { top: 150px; font-size: 10px; }
  .hud-lap-entry { min-width: 104px; }
}

@media (max-height: 480px) {
  .hud-map, .hud-laplist { display: none; }
}

</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui"></div>
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-title">SIM RACING</div>
      <div class="boot-bar"><span></span></div>
      <div class="boot-note">Strecke wird gebaut&hellip;</div>
    </div>
  </div>
